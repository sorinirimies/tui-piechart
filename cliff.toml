# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Commits must follow Conventional Commits to appear in the changelog:
#     <type>(<optional scope>)!: <summary>
# Types: feat fix perf refactor docs test build ci chore, plus project-specific
# component prefixes (add them to the "Components" parser below, e.g. cli / gui /
# web). Anything else is dropped silently (see `filter_unconventional` / `filter_commits` below).
#
# Preview the next release:  just changelog-preview     Regenerate:  just changelog

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. It is generated from
[Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org) — do not edit it by hand.

"""
# Groups are ordered by the number in the HTML comment that prefixes their name in
# `commit_parsers`; `striptags` removes it again for display.
body = """
{%- macro entry(commit) -%}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/sorinirimies/tui-piechart/commit/{{ commit.id }}))
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({% if previous.version -%}
https://github.com/sorinirimies/tui-piechart/compare/{{ previous.version }}...{{ version }}
{%- else -%}
https://github.com/sorinirimies/tui-piechart/releases/tag/{{ version }}
{%- endif %}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 -%}
### ⚠️ Breaking changes

{% for commit in breaking -%}
{{ self::entry(commit=commit) }}
{% endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
{{ self::entry(commit=commit) }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
# Parse commits as Conventional Commits…
conventional_commits = true
# …and drop the ones that aren't, or that match no parser below (keeps the log clean).
filter_unconventional = true
filter_commits = true
# Newest first inside each group.
sort_commits = "newest"
# A breaking change is never hidden by a skip rule.
protect_breaking_commits = true
# Only vX.Y.Z tags are releases; order them by semver, not by date.
tag_pattern = "v[0-9]*"
sort_tags = "semver"
# Don't let a `git revert` of a hidden commit show up as an entry of its own.
topo_order_commits = true

# First match wins, so the skips come first.
commit_parsers = [
    # ── noise ────────────────────────────────────────────────────────────────
    { message = "^chore: bump version",             skip = true },
    { message = "^chore\\(release\\)",              skip = true },
    { message = "^chore: release",                  skip = true },
    { message = "^(docs|chore)\\(changelog\\)",   skip = true },
    { message = "^(wip|fixup!|squash!|Merge )",     skip = true },

    # ── dependency refreshes (the nightly job): kept, so a release that is only a
    #    dependency update still says what it is ───────────────────────────────
    { message = "^(chore|build|fix)\\(deps(-dev)?\\)", group = "<!-- 08 -->📦 Dependencies" },

    # ── what changed for users ───────────────────────────────────────────────
    { message = "^feat",                            group = "<!-- 01 -->✨ Features" },
    { message = "^fix",                             group = "<!-- 02 -->🐛 Bug fixes" },
    { message = "^perf",                            group = "<!-- 03 -->⚡ Performance" },
    # Commits prefixed with the component they touch ("cli: …", "gui(theme): …")
    { message = "^(cli|gui|web|tui)(\\(.+\\))?!?:", group = "<!-- 04 -->🧩 Components" },
    { message = "^refactor",                        group = "<!-- 05 -->♻️ Refactor" },

    # ── how it is built and shipped ──────────────────────────────────────────
    { message = "^docs?",                           group = "<!-- 06 -->📚 Documentation" },
    { message = "^test",                            group = "<!-- 07 -->🧪 Tests" },
    { message = "^build",                           group = "<!-- 09 -->📦 Build" },
    { message = "^(ci|release)",                    group = "<!-- 10 -->🔄 CI and release" },
    { message = "^style",                           group = "<!-- 11 -->💄 Style" },
    { message = "^chore",                           group = "<!-- 12 -->🔧 Chores" },
]
