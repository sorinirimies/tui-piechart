name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day (03:00 CET)
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      # ── Nushell (shared upgrade script runs on both GitHub and Gitea) ────────
      - name: Install Nushell
        run: cargo install nu --locked

      # ── Upgrade, quality-gate, downgrade-guard, commit + push ────────────────
      # See scripts/upgrade_deps.nu for the full logic (shared with Gitea).
      - name: Run nightly dependency upgrade
        run: |
          nu scripts/upgrade_deps.nu \
            --bot-name "github-actions[bot]" \
            --bot-email "github-actions[bot]@users.noreply.github.com"
