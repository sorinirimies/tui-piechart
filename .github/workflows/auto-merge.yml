# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge — merge Dependabot PRs once CI passed on them
# ──────────────────────────────────────────────────────────────────────────────
# Dependabot only bumps GitHub Actions (.github/dependabot.yml); Cargo updates come
# from the nightly deps-update workflow. Every bump is merged once CI is green,
# majors included, as the Gitea nightly does (scripts/ci/actions_update.nu). PRs
# CI judged before this ran are merged by the nightly sweep (deps-update.yml).
#
# A PR that changes .github/workflows/* can only be merged with a GH_PAT secret
# (repo + workflow scopes); GITHUB_TOKEN is refused.
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge Dependabot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Merge the PR CI passed on
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: nu scripts/ci/auto_merge.nu "$BRANCH" "$SHA"
