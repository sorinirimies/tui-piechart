name: Release

# Push a vX.Y.Z tag (`just release X.Y.Z`): validate tag == Cargo.toml → gate →
# GitHub release with git-cliff notes → crates.io (only if the CRATES_IO_TOKEN
# secret is set; idempotent).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Validate tag
        id: v
        run: nu scripts/ci/validate_tag.nu "${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Versions match the tag
        run: nu scripts/ci/check_versions.nu "${{ steps.v.outputs.tag }}"

  gate:
    name: Quality gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - run: nu scripts/ci/quality_gate.nu


  publish:
    name: GitHub release
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: tui-piechart ${{ needs.validate.outputs.version }}
          body_path: RELEASE_NOTES.md

  crates-io:
    name: crates.io
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      # Multi-crate workspace: one line per crate, dependencies first.
      - name: Publish tui-piechart (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu tui-piechart
