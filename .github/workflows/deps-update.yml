name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day (03:00 CET)
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      # ── Nushell (shared upgrade script runs on both GitHub and Gitea) ────────
      - name: Install Nushell (prebuilt binary)
        run: |
          V=0.116.1
          curl -fsSL "https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 "/tmp/nu-$V-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu || { mkdir -p "$HOME/.cargo/bin" && install -m 0755 "/tmp/nu-$V-x86_64-unknown-linux-gnu/nu" "$HOME/.cargo/bin/nu"; }
          nu --version

      # ── Upgrade, quality-gate, downgrade-guard, commit + push ────────────────
      # See scripts/upgrade_deps.nu for the full logic (shared with Gitea).
      - name: Run nightly dependency upgrade
        id: upgrade
        run: |
          nu scripts/upgrade_deps.nu \
            --bot-name "github-actions[bot]" \
            --bot-email "github-actions[bot]@users.noreply.github.com"

      # Pushes authored by GITHUB_TOKEN don't trigger other workflows, so
      # dispatch release.yml explicitly when the script cut a release.
      - name: Trigger release workflow
        if: steps.upgrade.outputs.release_tag != ''
        run: gh workflow run release.yml --repo "${{ github.repository }}" -f tag="${{ steps.upgrade.outputs.release_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
