name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:30 UTC every day (03:30 CET)
    # Offset 30 min from GitHub to avoid simultaneous runs.
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      # ── Nushell (shared upgrade script runs on both Gitea and GitHub) ────────
      - name: Install Nushell (prebuilt binary)
        run: |
          V=0.116.1
          curl -fsSL "https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 "/tmp/nu-$V-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu || { mkdir -p "$HOME/.cargo/bin" && install -m 0755 "/tmp/nu-$V-x86_64-unknown-linux-gnu/nu" "$HOME/.cargo/bin/nu"; }
          nu --version

      # ── Upgrade, quality-gate, downgrade-guard, commit + push ────────────────
      # See scripts/upgrade_deps.nu for the full logic (shared with GitHub).
      #
      # By convention (matching the GitHub mirror and sibling projects),
      # deps-update commits dependency updates to main — it
      # only releases (patch bump + tag) when Cargo.toml dependency requirements
      # really changed. Lock-only updates are committed without a release.
      - name: Run nightly dependency upgrade
        id: upgrade
        run: |
          nu scripts/upgrade_deps.nu \
            --bot-name "gitea-actions[bot]" \
            --bot-email "gitea-actions[bot]@noreply.gitea"

      # Tag pushes by the built-in token may not trigger workflows, so dispatch
      # release.yml explicitly when the script cut a release.
      - name: Trigger release workflow
        if: steps.upgrade.outputs.release_tag != ''
        run: |
          TAG="${{ steps.upgrade.outputs.release_tag }}"
          echo "🚀 Dispatching release.yml for ${TAG}…"
          curl -sf -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"main\", \"inputs\": {\"tag\": \"${TAG}\"}}"
